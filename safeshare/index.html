<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeShare</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: rgba(24, 24, 27, .78);
      --border: rgba(255, 255, 255, .08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e5484d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #3a0e12 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Poppins", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .box {
      width: 100%; max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px -20px rgba(229, 72, 77, .35);
      animation: rise .5s ease-out both;
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 16px;
      display: grid; place-items: center;
      background: rgba(229, 72, 77, .12);
      color: var(--accent);
    }
    .icon svg { width: 28px; height: 28px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 14.5px; line-height: 1.6; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .btn {
      display: block; padding: 13px 18px; border-radius: 999px;
      font: 600 15px "Poppins", sans-serif; text-decoration: none;
      transition: box-shadow .25s, transform .25s, border-color .25s;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.ghost { border: 1px solid var(--border); color: var(--text); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(229, 72, 77, .45); border-color: var(--accent); }
    .back { display: inline-block; margin-top: 18px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .back:hover { color: var(--text); }

    .checking .icon { animation: pulse 1.2s ease-in-out infinite; }
    .hidden { display: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="box checking" id="box">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>

    <!-- While checking -->
    <div id="checking">
      <h1>SafeShare</h1>
      <p>Checking if the server is on…</p>
    </div>

    <!-- When the server is off -->
    <div id="offline" class="hidden">
      <h1>SafeShare is offline</h1>
      <p>This project runs on Hassan's own machine, so it is only online when he turns it on.
        Send him an email and he will start it for you.</p>
      <div class="actions">
        <a class="btn primary" id="mail" href="#">Email Hassan</a>
        <a class="btn ghost" id="try" href="#">Try opening it anyway</a>
      </div>
    </div>

    <a class="back" href="../">← Back to links</a>
  </main>

  <script>
    // ======= عدّل من هون =======
    // رابط الـ tunnel الثابت (devtunnel) لما يكون المشروع شغال
    const TUNNEL_URL = "https://YOUR-TUNNEL-5173.devtunnels.ms";
    const EMAIL = "hassanaldajah2004@gmail.com";
    // ===========================

    const subject = encodeURIComponent("SafeShare demo");
    const body = encodeURIComponent("Hi Hassan, I'd like to see SafeShare. Could you turn it on?");
    document.getElementById("mail").href = `mailto:${EMAIL}?subject=${subject}&body=${body}`;
    document.getElementById("try").href = TUNNEL_URL;

    function showOffline() {
      document.getElementById("box").classList.remove("checking");
      document.getElementById("checking").classList.add("hidden");
      document.getElementById("offline").classList.remove("hidden");
    }

    // If the app's icon loads through the tunnel, the app is on: go straight to it.
    // If it fails or takes too long, the machine is off: show the message.
    const probe = new Image();
    const timer = setTimeout(() => { probe.src = ""; showOffline(); }, 6000);
    probe.onload = () => { clearTimeout(timer); location.replace(TUNNEL_URL); };
    probe.onerror = () => { clearTimeout(timer); showOffline(); };
    probe.src = `${TUNNEL_URL}/safeshare.svg?t=${Date.now()}`;
  </script>
</body>
</html>
