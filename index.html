<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hassan Aldajah</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: rgba(24, 24, 27, .72);
      --border: rgba(255, 255, 255, .08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e5484d;
      --accent-deep: #8f1d22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Poppins", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      overflow-x: hidden;
    }

    /* ---- Background: slow drifting red glows + floating embers ---- */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .bg span {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5;
      will-change: transform;
    }
    .bg span:nth-child(1) {
      width: 480px; height: 480px; top: -180px; left: -120px;
      background: #8f1d22;
      animation: float1 22s ease-in-out infinite alternate;
    }
    .bg span:nth-child(2) {
      width: 420px; height: 420px; bottom: -160px; right: -140px;
      background: #6b1419;
      animation: float2 26s ease-in-out infinite alternate;
    }
    .bg span:nth-child(3) {
      width: 300px; height: 300px; top: 40%; left: 50%; margin-left: -150px;
      background: #3d0c10; opacity: .7;
      animation: float3 30s ease-in-out infinite alternate;
    }
    #embers { position: absolute; inset: 0; width: 100%; height: 100%; }
    @keyframes float1 { 50% { transform: translate(140px, 120px) scale(1.15); } 100% { transform: translate(60px, 260px) scale(.9); } }
    @keyframes float2 { 50% { transform: translate(-160px, -100px) scale(1.2); } 100% { transform: translate(-40px, -240px) scale(1); } }
    @keyframes float3 { 50% { transform: translate(-120px, 80px) scale(1.3); } 100% { transform: translate(110px, -60px) scale(.85); } }

    main { width: 100%; max-width: 440px; text-align: center; }

    /* ---- Avatar: plain photo, red shadow underneath on hover ---- */
    .avatar {
      display: block;
      width: 168px; height: 168px; margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 rgba(229, 72, 77, 0);
      transition: box-shadow .35s ease, transform .35s ease;
      animation: rise .7s ease-out both;
    }
    .avatar:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px -6px rgba(229, 72, 77, .65);
    }

    /* ---- Name with a slow shine ---- */
    h1 {
      font-size: 26px; font-weight: 700; letter-spacing: .3px;
      margin-bottom: 30px;
      background: linear-gradient(100deg, #fff 40%, #ff8a8e 50%, #fff 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: rise .7s .1s ease-out both, shine 5s 1s linear infinite;
    }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }

    /* ---- Link buttons ---- */
    ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    li { animation: rise .55s ease-out both; animation-delay: calc(.2s + var(--i) * .07s); }
    a.link {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      /* Labels sit on the exact centre of the button; the icons are pinned in one straight column (see below) */
      padding: 14px 56px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      text-decoration: none;
      font-size: 16px; font-weight: 600;
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    a.link::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-20deg);
      transition: left .6s ease;
    }
    /* --brand / --glow are set per link from its icon colour (see the script) */
    a.link:hover, a.link:focus-visible {
      border-color: var(--brand, var(--accent));
      box-shadow: 0 0 20px var(--glow, rgba(229, 72, 77, .45));
      transform: translateY(-3px) scale(1.015);
      outline: none;
    }
    a.link:hover::after, a.link:focus-visible::after { left: 120%; }
    a.link:active { transform: scale(.98); }
    a.link svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; transition: transform .25s; }
    a.link > svg, a.link > .logo { position: absolute; left: var(--icon-left, 24px); top: 0; bottom: 0; margin: auto 0; }
    a.link:hover svg { transform: scale(1.15); }

    /* Project links: round logo with a ring in the project's own colours */
    .logo {
      flex-shrink: 0;
      width: 20px; height: 20px; padding: 1.5px;
      border-radius: 50%;
      background: var(--ring);
      box-shadow: 0 0 8px var(--glow);
      transition: transform .25s;
    }
    .logo img { display: block; width: 100%; height: 100%; border-radius: 50%; background: #0b0b0d; }
    a.link:hover .logo { transform: scale(1.08); }

    /* Small label that starts a new group of links */
    li.section {
      display: flex; align-items: center; gap: 12px;
      margin-top: 14px;
      color: var(--muted); font-size: 12px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
    }
    li.section::before, li.section::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(229,72,77,.5), transparent);
    }

    footer { margin-top: 40px; color: var(--muted); font-size: 12px; animation: rise .6s .8s ease-out both; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    // Icons that are not drawn on the 24x24 grid
    const VIEWBOX = { gmail: "52 42 88 66" };

    const list = document.getElementById("links");
    LINKS.forEach((l, i) => {
      if (l.section) {
        const label = document.createElement("li");
        label.className = "section";
        label.style.setProperty("--i", i);
        label.textContent = l.section;
        list.append(label);
      }
      const li = document.createElement("li");
      li.style.setProperty("--i", i);
      const a = document.createElement("a");
      a.className = "link";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      const brand = l.brand || l.color;
      if (brand) {
        a.style.setProperty("--brand", brand);
        a.style.setProperty("--glow", brand + "73");
      }
      if (l.logo) {
        a.classList.add("project");
        a.style.setProperty("--ring", l.ring || l.brand);
        a.innerHTML = `<span class="logo"><img src="${l.logo}" alt="" width="17" height="17" loading="lazy"></span>`;
      } else {
        a.innerHTML = `<svg viewBox="${VIEWBOX[l.icon] || "0 0 24 24"}" aria-hidden="true" style="color:${l.color || "currentColor"}">${ICONS[l.icon] || ICONS.web}</svg>`;
      }
      a.append(l.title);
      li.append(a);
      list.append(li);
    });
    // Pin every icon in one straight column, 12px to the left of the widest label (labels stay centred)
    function placeIcons() {
      let widest = 0;
      list.querySelectorAll("a.link").forEach(a => {
        const range = document.createRange();
        range.selectNodeContents(a.lastChild);
        widest = Math.max(widest, range.getBoundingClientRect().width);
      });
      list.style.setProperty("--icon-left", `max(20px, calc(50% - ${widest / 2 + 12 + 20}px))`);
    }
    placeIcons();
    document.fonts.ready.then(placeIcons); // re-measure once Poppins has loaded
    document.getElementById("year").textContent = new Date().getFullYear();

    // Soft embers drifting up the background
    (() => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = document.getElementById("embers");
      const ctx = canvas.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let w, h, embers = [];

      function resize() {
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(60, (w * h) / 16000));
        embers = Array.from({ length: count }, () => spawn(true));
      }
      function spawn(anywhere) {
        return {
          x: Math.random() * w,
          y: anywhere ? Math.random() * h : h + 10,
          r: Math.random() * 1.8 + .6,
          speed: Math.random() * .35 + .15,
          sway: Math.random() * 1.5 + .5,
          phase: Math.random() * Math.PI * 2,
          alpha: Math.random() * .5 + .2,
          hue: Math.random() < .75 ? "255, 110, 100" : "255, 220, 200"
        };
      }
      function frame(t) {
        ctx.clearRect(0, 0, w, h);
        for (const e of embers) {
          e.y -= e.speed;
          const x = e.x + Math.sin(t / 2000 + e.phase) * e.sway * 6;
          const fade = Math.min(1, e.y / (h * .25));
          ctx.beginPath();
          ctx.arc(x, e.y, e.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${e.hue}, ${e.alpha * fade})`;
          ctx.shadowBlur = 8; ctx.shadowColor = `rgba(${e.hue}, .8)`;
          ctx.fill();
          if (e.y < -10) Object.assign(e, spawn(false));
        }
        requestAnimationFrame(frame);
      }
      addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
