<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hassan Aldajah</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030409;
      --card: rgba(10, 11, 17, .8);
      --border: rgba(255, 255, 255, .08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #6aa8ff;
      --accent-deep: #1f3f8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Poppins", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      overflow-x: hidden;
    }

    /* ---- Background: black storm clouds (WebGL) with lightning (2D canvas on top) ---- */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #030409; }
    .bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    main { width: 100%; max-width: 440px; text-align: center; }

    /* ---- Avatar: plain photo, red shadow underneath on hover ---- */
    .avatar {
      display: block;
      width: 168px; height: 168px; margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 rgba(229, 72, 77, 0);
      transition: box-shadow .35s ease, transform .35s ease;
      animation: rise .7s ease-out both;
    }
    .avatar:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px -6px rgba(106, 168, 255, .55);
    }

    /* ---- Name with a slow shine ---- */
    h1 {
      font-size: 26px; font-weight: 700; letter-spacing: .3px;
      margin-bottom: 30px;
      background: linear-gradient(100deg, #fff 40%, #9cc8ff 50%, #fff 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: rise .7s .1s ease-out both, shine 5s 1s linear infinite;
    }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }

    /* ---- Link buttons ---- */
    ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    li { animation: rise .55s ease-out both; animation-delay: calc(.2s + var(--i) * .07s); }
    a.link {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      /* Labels sit on the exact centre of the button; the icons are pinned in one straight column (see below) */
      padding: 14px 56px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      text-decoration: none;
      font-size: 16px; font-weight: 600;
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    a.link::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-20deg);
      transition: left .6s ease;
    }
    /* --brand / --glow are set per link from its icon colour (see the script) */
    a.link:hover, a.link:focus-visible {
      border-color: var(--brand, var(--accent));
      box-shadow: 0 0 20px var(--glow, rgba(106, 168, 255, .45));
      transform: translateY(-3px) scale(1.015);
      outline: none;
    }
    a.link:hover::after, a.link:focus-visible::after { left: 120%; }
    a.link:active { transform: scale(.98); }
    a.link svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; transition: transform .25s; }
    a.link > svg, a.link > .logo { position: absolute; left: var(--icon-left, 24px); top: 0; bottom: 0; margin: auto 0; }
    a.link:hover svg { transform: scale(1.15); }

    /* Project links: round logo with a ring in the project's own colours */
    .logo {
      flex-shrink: 0;
      width: 20px; height: 20px; padding: 1.5px;
      border-radius: 50%;
      background: var(--ring);
      box-shadow: 0 0 8px var(--glow);
      transition: transform .25s;
    }
    .logo img { display: block; width: 100%; height: 100%; border-radius: 50%; background: #0b0b0d; }
    a.link:hover .logo { transform: scale(1.08); }

    /* Small label that starts a new group of links */
    li.section {
      display: flex; align-items: center; gap: 12px;
      margin-top: 14px;
      color: var(--muted); font-size: 12px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
    }
    li.section::before, li.section::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(106,168,255,.5), transparent);
    }

    footer { margin-top: 40px; color: var(--muted); font-size: 12px; animation: rise .6s .8s ease-out both; }

    /* Storm sound on/off (starts off: browsers block autoplay, and nobody wants a surprise thunderclap) */
    .sound {
      position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: var(--muted); cursor: pointer;
      transition: border-color .25s, color .25s, box-shadow .25s;
    }
    .sound svg { width: 20px; height: 20px; fill: currentColor; }
    .sound:hover, .sound:focus-visible { border-color: var(--accent); color: var(--text); box-shadow: 0 0 16px rgba(106, 168, 255, .45); outline: none; }
    .sound[aria-pressed="true"] { color: var(--accent); border-color: rgba(106, 168, 255, .5); }
    .sound .waves { display: none; }
    .sound[aria-pressed="true"] .waves { display: inline; }
    .sound[aria-pressed="true"] .slash { display: none; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    // Icons that are not drawn on the 24x24 grid

    const list = document.getElementById("links");
    LINKS.forEach((l, i) => {
      if (l.section) {
        const label = document.createElement("li");
        label.className = "section";
        label.style.setProperty("--i", i);
        label.textContent = l.section;
        list.append(label);
      }
      const li = document.createElement("li");
      li.style.setProperty("--i", i);
      const a = document.createElement("a");
      a.className = "link";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      const brand = l.brand || l.color;
      if (brand) {
        a.style.setProperty("--brand", brand);
        a.style.setProperty("--glow", brand + "73");
      }
      if (l.logo) {
        a.classList.add("project");
        a.style.setProperty("--ring", l.ring || l.brand);
        a.innerHTML = `<span class="logo"><img src="${l.logo}" alt="" width="17" height="17" loading="lazy"></span>`;
      } else {
        a.innerHTML = `<svg viewBox="${VIEWBOX[l.icon] || "0 0 24 24"}" aria-hidden="true" style="color:${l.color || "currentColor"}">${ICONS[l.icon] || ICONS.web}</svg>`;
      }
      a.append(l.title);
      li.append(a);
      list.append(li);
    });
    // Pin every icon in one straight column, 12px to the left of the widest label (labels stay centred)
    function placeIcons() {
      let widest = 0;
      list.querySelectorAll("a.link").forEach(a => {
        const range = document.createRange();
        range.selectNodeContents(a.lastChild);
        widest = Math.max(widest, range.getBoundingClientRect().width);
      });
      list.style.setProperty("--icon-left", `max(20px, calc(50% - ${widest / 2 + 12 + 20}px))`);
    }
    placeIcons();
    document.fonts.ready.then(placeIcons); // re-measure once Poppins has loaded
    document.getElementById("year").textContent = new Date().getFullYear();

    // Black storm clouds with lightning. The clouds are a WebGL shader (animated fractal noise) that gets lit
    // from inside around each strike; the bolts are drawn on a second canvas on top.
    (() => {
      const sky = document.getElementById("sky");
      const boltCanvas = document.getElementById("bolts");
      const ctx = boltCanvas.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rand = (a, b) => a + Math.random() * (b - a);

      const VERT = "attribute vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }";
      const FRAG = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform vec2 uRes;
        uniform float uTime;
        uniform float uAmb;
        uniform vec4 uFl[4];            // x, y (0..1, y down), intensity, falloff

        float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3. - 2. * f);
          return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y);
        }
        const mat2 M = mat2(1.6, 1.2, -1.2, 1.6);
        float fbm5(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = M * p; a *= .5; } return v; }
        float fbm4(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 4; i++) { v += a * noise(p); p = M * p; a *= .5; } return v; }

        void main() {
          vec2 uv = gl_FragCoord.xy / uRes; uv.y = 1. - uv.y;
          float asp = uRes.x / uRes.y;
          vec2 p = vec2(uv.x * asp, uv.y) * 1.7;
          float t = uTime;

          // billowing, domain-warped clouds rolling sideways
          vec2 q = vec2(fbm4(p + vec2(t * .035, 0.)), fbm4(p + vec2(5.2, 1.3) - vec2(0., t * .025)));
          vec2 w = p + 1.25 * q + vec2(-t * .05, t * .01);
          float d  = fbm5(w);
          float d2 = fbm4(w + vec2(.05, -.08));                 // sample towards the light, for billow shading
          float n  = fbm4(p * 1.9 + vec2(-t * .08, 3.1) + q);   // fine detail layer, moves faster

          float dens  = smoothstep(.30, .72, d);                 // 0 = gap between clouds, 1 = thick cloud
          float shade = clamp((d - d2) * 8. + .5, 0., 1.);

          vec3 col = mix(vec3(.008, .011, .026), vec3(.085, .095, .135), dens);
          col += vec3(.075, .088, .135) * shade * dens;
          col += vec3(.020, .026, .042) * smoothstep(.4, .85, n) * dens;

          // light from the lightning scattering through the cloud
          float lit = 0.;
          for (int i = 0; i < 4; i++) {
            vec2 dv = (uv - uFl[i].xy) * vec2(asp, 1.);
            lit += uFl[i].z * exp(-length(dv) * uFl[i].w);
          }
          vec3 glow = vec3(.46, .62, 1.) * lit * (.22 + .78 * dens) * (.5 + 1.1 * shade) * (.65 + .7 * n);
          col += glow / (1. + glow * 1.3);                       // soft knee so a strike never blows out the whole sky
          col += vec3(.20, .30, .60) * uAmb * dens * .10;

          col *= 1. - .55 * dot(uv - .5, uv - .5);                // vignette
          gl_FragColor = vec4(col, 1.);
        }`;

      let gl = null, uRes, uTime, uAmb, uFl;
      try {
        gl = sky.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
        if (gl) {
          const mk = (type, src) => {
            const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
            return s;
          };
          const prog = gl.createProgram();
          gl.attachShader(prog, mk(gl.VERTEX_SHADER, VERT));
          gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FRAG));
          gl.linkProgram(prog); gl.useProgram(prog);
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          const loc = gl.getAttribLocation(prog, "p");
          gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
          uRes = gl.getUniformLocation(prog, "uRes"); uTime = gl.getUniformLocation(prog, "uTime");
          uAmb = gl.getUniformLocation(prog, "uAmb"); uFl = gl.getUniformLocation(prog, "uFl");
        }
      } catch (e) { gl = null; console.warn("Storm clouds: WebGL unavailable, using a flat sky", e); }

      let w, h, scale, bolts = [], started = false, nextStrike = 0, nextArc = 0;
      const lights = new Float32Array(16);

      function resize() {
        w = boltCanvas.clientWidth; h = boltCanvas.clientHeight;
        boltCanvas.width = w * dpr; boltCanvas.height = h * dpr;
        scale = Math.min(1.3, Math.max(.7, w / 700));
        // the clouds are soft, so render them small and let the browser stretch them
        const q = Math.min(.5, 720 / w);
        sky.width = Math.max(2, Math.round(w * q)); sky.height = Math.max(2, Math.round(h * q));
        if (gl) { gl.viewport(0, 0, sky.width, sky.height); gl.uniform2f(uRes, sky.width, sky.height); }
        else {
          const c = sky.getContext("2d"), g = c.createRadialGradient(sky.width / 2, sky.height / 2, 0, sky.width / 2, sky.height / 2, sky.height);
          g.addColorStop(0, "#0b0e1a"); g.addColorStop(1, "#030409");
          c.fillStyle = g; c.fillRect(0, 0, sky.width, sky.height);
        }
        if (reduce) draw(0, []);
      }

      // Lightning shapes ------------------------------------------------------------
      function jagged(x0, y0, x1, y1, disp, depth) {
        let pts = [[x0, y0], [x1, y1]];
        for (let d = 0; d < depth; d++) {
          const out = [pts[0]];
          for (let i = 0; i < pts.length - 1; i++) {
            const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
            const len = Math.hypot(bx - ax, by - ay) || 1, o = (Math.random() - .5) * disp;
            out.push([(ax + bx) / 2 - (by - ay) / len * o, (ay + by) / 2 + (bx - ax) / len * o], [bx, by]);
          }
          pts = out; disp *= .55;
        }
        return pts;
      }

      function branches(main, mainLen, paths, chance, wid) {
        for (let i = 3; i < main.length - 2; i += 2) {
          if (Math.random() > chance) continue;
          const [x, y] = main[i], [px, py] = main[i - 2];
          const base = Math.atan2(y - py, x - px) + (Math.random() < .5 ? -1 : 1) * rand(.35, 1.0);
          const len = mainLen * rand(.06, .2);
          const pts = jagged(x, y, x + Math.cos(base) * len, y + Math.sin(base) * len, len * .45, 4);
          paths.push({ pts, w: wid });
          if (Math.random() < .3) {
            const [mx, my] = pts[pts.length >> 1], a = base + rand(-.9, .9), l = len * rand(.3, .6);
            paths.push({ pts: jagged(mx, my, mx + Math.cos(a) * l, my + Math.sin(a) * l, l * .5, 3), w: wid * .6 });
          }
        }
      }

      // a bolt from the cloud ceiling down towards the ground
      function strike(now) {
        const x0 = rand(.1 * w, .9 * w), y0 = rand(-10, .1 * h);
        const x1 = x0 + rand(-.22 * w, .22 * w), y1 = rand(.5 * h, 1.02 * h);
        const len = Math.hypot(x1 - x0, y1 - y0), main = jagged(x0, y0, x1, y1, len * .3, 6);
        const paths = [{ pts: main, w: 1 }];
        branches(main, len, paths, .4, .5);
        const m = main[main.length >> 1];
        bolts.push({
          born: now, life: 620, decay: 55, strikes: [0, rand(60, 120), rand(170, 270)], scale, paths,
          lights: [{ x: x0, y: y0 + .08 * h, s: 1.1, r: 2.8 }, { x: m[0], y: m[1] * .6, s: .5, r: 3.4 }],
          glow: [{ x: x0, y: y0 + .05 * h, r: 170 * scale }]
        });
        dispatchEvent(new CustomEvent("storm", { detail: { kind: "strike", x: x0 / w } }));   // the sound listens for this
      }

      // a horizontal arc crawling through the clouds
      function arc(now) {
        const x0 = rand(-.05 * w, .9 * w), y0 = rand(.03 * h, .6 * h), dir = Math.random() < .5 ? -1 : 1;
        const len = rand(.15, .5) * w, x1 = x0 + dir * len, y1 = y0 + rand(-.07, .07) * h;
        const main = jagged(x0, y0, x1, y1, len * .22, 6);
        const paths = [{ pts: main, w: .55 }];
        branches(main, len, paths, .5, .3);
        bolts.push({
          born: now, life: 330, decay: 42, strikes: [0, rand(50, 100)], scale, paths,
          lights: [{ x: (x0 + x1) / 2, y: (y0 + y1) / 2, s: .55, r: 4.6 }],
          glow: []
        });
        dispatchEvent(new CustomEvent("storm", { detail: { kind: "arc", x: (x0 + x1) / 2 / w } }));
      }

      function pulse(b, age) {  // return strokes: a bright hit, then quick flickers
        let v = 0;
        for (const s of b.strikes) if (age >= s) v += Math.exp(-(age - s) / b.decay);
        return Math.min(1, v);
      }

      function draw(now, active) {
        const t = now / 1000;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        const ls = [];
        for (const b of active) {
          const k = pulse(b, now - b.born);
          if (k < .01) continue;
          for (const g of b.glow) {
            const rg = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
            rg.addColorStop(0, `rgba(170,200,255,${.35 * k})`); rg.addColorStop(1, "rgba(80,120,255,0)");
            ctx.fillStyle = rg; ctx.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
          }
          for (const p of b.paths) {
            ctx.beginPath();
            p.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
            const s = p.w * b.scale;
            ctx.strokeStyle = `rgba(70,110,255,${.25 * k})`;   ctx.lineWidth = 16 * s; ctx.stroke();
            ctx.strokeStyle = `rgba(140,185,255,${.65 * k})`;  ctx.lineWidth = 5.5 * s; ctx.stroke();
            ctx.strokeStyle = `rgba(255,255,255,${k})`;        ctx.lineWidth = 2 * s;   ctx.stroke();
          }
          for (const L of b.lights) ls.push([L.x / w, L.y / h, L.s * k, L.r]);
        }
        if (gl) {
          ls.sort((a, b) => b[2] - a[2]);
          lights.fill(0);
          for (let i = 0; i < 4 && i < ls.length; i++) lights.set(ls[i], i * 4);
          gl.uniform1f(uTime, t * 1.3 + 40);
          gl.uniform1f(uAmb, .5 + .5 * Math.sin(t * .8));
          gl.uniform4fv(uFl, lights);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
      }

      function frame(now) {
        if (!started) { started = true; nextStrike = now + 900; nextArc = now + 250; }
        if (now > nextArc) { arc(now); nextArc = now + rand(350, 1100); }
        if (now > nextStrike) {
          strike(now);
          nextStrike = now + (Math.random() < .3 ? rand(250, 500) : rand(1800, 4200));   // sometimes a double strike
        }
        bolts = bolts.filter(b => now - b.born < b.life);
        draw(now, bolts);
        requestAnimationFrame(frame);
      }

      addEventListener("resize", resize);
      resize();
      if (!reduce) requestAnimationFrame(frame);
    })();

    // Storm sound, synthesised with Web Audio (no audio files): a bed of wind and rain, plus a thunder roll after
    // every strike, panned to where it hit and arriving a little late (the further away, the later).
    (() => {
      const btn = document.getElementById("sound");
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { btn.remove(); return; }
      const rand = (a, b) => a + Math.random() * (b - a);
      const LEVEL = .6;      // volume once the fade-in is done: medium, not loud
      const START = .03;     // where it starts: very quiet
      const FADE_IN = 12;    // seconds to rise from START to LEVEL, as a steady (perceptually even) swell
      let ac, master, bus, brown, white, on = false;

      function noise(seconds, brownian) {
        const len = Math.floor(ac.sampleRate * seconds), buf = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = buf.getChannelData(c);
          let last = 0;
          for (let i = 0; i < len; i++) {
            const v = Math.random() * 2 - 1;
            if (brownian) { last = (last + .02 * v) / 1.02; d[i] = last * 3.5; } else d[i] = v;
          }
        }
        return buf;
      }

      function setup() {
        ac = new AC();
        const comp = ac.createDynamicsCompressor();   // a gentle limiter: only tames the loudest peaks, so thunder still stands out from the wind
        comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 6; comp.attack.value = .002; comp.release.value = .2;
        master = ac.createGain(); master.gain.value = 0;
        master.connect(comp); comp.connect(ac.destination);
        brown = noise(10, true); white = noise(6, false);

        // Thunder goes through a soft saturator. It adds harmonics of the deep rumble, which a phone speaker can play
        bus = ac.createWaveShaper(); bus.oversample = "2x";
        const curve = new Float32Array(1024);
        for (let i = 0; i < curve.length; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(2.2 * x) / Math.tanh(2.2); }
        bus.curve = curve; bus.connect(master);

        // wind: brown noise through a low-pass whose cutoff drifts slowly, like gusts
        const wind = ac.createBufferSource(); wind.buffer = brown; wind.loop = true;
        const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380;
        const gust = ac.createOscillator(); gust.frequency.value = .07;
        const gustDepth = ac.createGain(); gustDepth.gain.value = 170;
        gust.connect(gustDepth); gustDepth.connect(lp.frequency);
        const windGain = ac.createGain(); windGain.gain.value = .2;
        wind.connect(lp); lp.connect(windGain); windGain.connect(master);

        // the mid-range whoosh of the gusts: the deep wind alone would vanish on a phone speaker
        const air = ac.createBufferSource(); air.buffer = white; air.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 550; bp.Q.value = .6;
        const airGain = ac.createGain(); airGain.gain.value = .03;
        const airSwell = ac.createGain(); airSwell.gain.value = .025;
        gust.connect(airSwell); airSwell.connect(airGain.gain);
        air.connect(bp); bp.connect(airGain); airGain.connect(master);
        air.start();

        // rain: a soft hiss
        const rain = ac.createBufferSource(); rain.buffer = white; rain.loop = true;
        const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2200;
        const hiss = ac.createBiquadFilter(); hiss.type = "lowpass"; hiss.frequency.value = 8000;
        const rainGain = ac.createGain(); rainGain.gain.value = .03;
        rain.connect(hp); hp.connect(hiss); hiss.connect(rainGain); rainGain.connect(master);

        wind.start(); rain.start(); gust.start();
      }

      // the sharp "crack" of a close strike
      function crack(t0) {
        const src = ac.createBufferSource(); src.buffer = white;
        const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
        const g = ac.createGain();
        g.gain.setValueAtTime(.0001, t0);
        g.gain.exponentialRampToValueAtTime(.5, t0 + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
        src.connect(hp); hp.connect(g); g.connect(master);
        src.start(t0, rand(0, 5)); src.stop(t0 + .3);
      }

      function thunder(kind, x) {
        if (!on) return;
        const big = kind === "strike";
        const delay = big ? rand(.15, 1.3) : rand(.4, 1.8);
        const t0 = ac.currentTime + delay, dur = big ? rand(3.5, 6) : rand(1.6, 2.8);
        const peak = (big ? 1.6 : .6) * (delay < .5 ? 1 : .8);
        const src = ac.createBufferSource(); src.buffer = brown;
        const lp = ac.createBiquadFilter(); lp.type = "lowpass";
        lp.frequency.setValueAtTime(big ? 1200 : 600, t0);
        lp.frequency.exponentialRampToValueAtTime(150, t0 + dur);     // the rumble sinks as it rolls away
        const g = ac.createGain();
        g.gain.setValueAtTime(.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + .05);
        g.gain.exponentialRampToValueAtTime(peak * .3, t0 + .4);
        g.gain.exponentialRampToValueAtTime(peak * .7, t0 + .9 + rand(0, .5));   // and swells again
        if (big) g.gain.exponentialRampToValueAtTime(peak * .12, t0 + dur * .6);  // a long tail
        g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        src.connect(lp); lp.connect(g);
        const body = ac.createBufferSource(); body.buffer = white; body.loop = true;   // mid-range body, so phones hear it too
        const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 320; bp.Q.value = .6;
        const bodyGain = ac.createGain(); bodyGain.gain.value = .4;
        body.connect(bp); bp.connect(bodyGain); bodyGain.connect(g);
        let out = g;
        if (ac.createStereoPanner) {
          const pan = ac.createStereoPanner();
          pan.pan.value = Math.max(-1, Math.min(1, (x - .5) * 1.6));
          g.connect(pan); out = pan;
        }
        out.connect(bus);
        src.start(t0, rand(0, 3)); src.stop(t0 + dur + .2);
        body.start(t0, rand(0, 5)); body.stop(t0 + dur + .2);
        if (big && delay < .6) crack(t0);
      }

      btn.addEventListener("click", () => {
        if (!ac) setup();
        on = !on;
        if (on) ac.resume();
        const now = ac.currentTime;
        master.gain.cancelScheduledValues(now);
        const g0 = Math.max(master.gain.value, START);
        master.gain.setValueAtTime(on ? g0 : master.gain.value, now);
        if (on) {   // start quiet and swell slowly to LEVEL (same rate of rise if it was already part-way up)
          master.gain.exponentialRampToValueAtTime(LEVEL, now + FADE_IN * Math.log(LEVEL / g0) / Math.log(LEVEL / START));
        } else {    // quick fade out
          master.gain.setTargetAtTime(0, now, .15);
        }
        if (!on) setTimeout(() => { if (!on) ac.suspend(); }, 700);
        btn.setAttribute("aria-pressed", on);
        btn.setAttribute("aria-label", on ? "Turn storm sound off" : "Turn storm sound on");
      });
      addEventListener("storm", e => thunder(e.detail.kind, e.detail.x));
      document.addEventListener("visibilitychange", () => {   // no sound from a background tab
        if (!ac) return;
        if (document.hidden) ac.suspend(); else if (on) ac.resume();
      });
    })();
  </script>
</body>
</html>
