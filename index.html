  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e10;
      --card: #18181b;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e5484d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #2a0f12 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Cairo", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 440px; text-align: center; }
    .avatar {
      width: 120px; height: 120px; border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 24px rgba(229, 72, 77, .35);
      margin-bottom: 14px;
    }
    h1 { font-size: 22px; font-weight: 700; }
    .bio { color: var(--muted); font-size: 15px; margin: 6px 0 28px; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    a.link {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 16px; font-weight: 600;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    a.link:hover, a.link:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(229, 72, 77, .45);
      transform: translateY(-2px);
      outline: none;
    }
    a.link svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; }
    footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
  </style>
</head>
