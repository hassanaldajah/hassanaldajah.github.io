<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hassan Aldajah</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030409;
      --card: rgba(10, 11, 17, .8);
      --border: rgba(255, 255, 255, .08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #6aa8ff;
      --accent-deep: #1f3f8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Poppins", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 0;
      overflow-x: hidden;
    }

    /* ---- Background: the looping video, shown whole in the middle (it also carries the song); the links sit in rows above and below it ---- */
    /* blue grid (40px squares, like the Nashmi site's red one) in the sound button's blue at low strength, fading towards the edges.
       It is the page background, so it sits behind the lightning and behind the (opaque) video and never touches the picture. */
    .bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse 75% 65% at 50% 40%, transparent 0%, rgba(3, 4, 9, .55) 60%, rgba(3, 4, 9, .92) 100%),
        linear-gradient(rgba(106, 168, 255, .25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106, 168, 255, .25) 1px, transparent 1px),
        #030409;
      background-size: auto, 40px 40px, 40px 40px, auto;
    }
    .bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* the video is opaque: the lightning is drawn behind it and only shows around it */
    .bg video { position: absolute; left: 0; top: var(--rt, 0px); width: 100%; height: calc(100% - var(--rt, 0px) - var(--rb, 0px)); object-fit: contain; display: block; }

    main { width: 100%; max-width: 440px; text-align: center; }

    /* ---- Avatar: plain photo, red shadow underneath on hover ---- */
    .avatar {
      position: fixed; top: 16px; left: 16px; z-index: 200;
      display: block;
      width: 52px; height: 52px; margin: 0;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 rgba(229, 72, 77, 0);
      transition: box-shadow .35s ease, transform .35s ease;
      animation: rise .7s ease-out both;
    }
    .avatar:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px -6px rgba(106, 168, 255, .55);
    }

    /* ---- Name with a slow shine ---- */
    h1 {
      position: fixed; top: 16px; left: 80px; z-index: 200; height: 52px; display: flex; align-items: center; pointer-events: none;
      font-size: 18px; font-weight: 700; letter-spacing: .3px;
      margin: 0;
      background: linear-gradient(100deg, #fff 40%, #9cc8ff 50%, #fff 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: rise .7s .1s ease-out both, shine 5s 1s linear infinite;
    }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }

    /* ---- Link buttons ---- */
    ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    li { animation: rise .55s ease-out both; animation-delay: calc(.2s + var(--i) * .07s); }
    a.link {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      /* Labels sit on the exact centre of the button; the icons are pinned in one straight column (see below) */
      padding: 14px 56px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      text-decoration: none;
      font-size: 16px; font-weight: 600;
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    a.link::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-20deg);
      transition: left .6s ease;
    }
    /* --brand / --glow are set per link from its icon colour (see the script) */
    a.link:hover, a.link:focus-visible {
      border-color: var(--brand, var(--accent));
      box-shadow: 0 0 20px var(--glow, rgba(106, 168, 255, .45));
      transform: translateY(-3px) scale(1.015);
      outline: none;
    }
    a.link:hover::after, a.link:focus-visible::after { left: 120%; }
    a.link:active { transform: scale(.98); }
    a.link svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; transition: transform .25s; }
    a.link > svg, a.link > .logo { position: absolute; left: var(--icon-left, 24px); top: 0; bottom: 0; margin: auto 0; }
    a.link:hover svg { transform: scale(1.15); }

    /* Project links: round logo with a ring in the project's own colours */
    .logo {
      flex-shrink: 0;
      width: 20px; height: 20px; padding: 1.5px;
      border-radius: 50%;
      background: var(--ring);
      box-shadow: 0 0 8px var(--glow);
      transition: transform .25s;
    }
    .logo img { display: block; width: 100%; height: 100%; border-radius: 50%; background: #0b0b0d; }
    a.link:hover .logo { transform: scale(1.08); }

    /* Small label that starts a new group of links */
    li.section {
      display: flex; align-items: center; gap: 12px;
      margin-top: 14px;
      color: var(--muted); font-size: 12px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
    }
    li.section::before, li.section::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(106,168,255,.5), transparent);
    }

    footer { margin-top: 40px; color: var(--muted); font-size: 12px; animation: rise .6s .8s ease-out both; }

    /* Sound on/off (starts off: browsers block autoplay) */
    .sound {
      position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 300;
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: var(--muted); cursor: pointer;
      transition: border-color .25s, color .25s, box-shadow .25s;
    }
    .sound svg { width: 20px; height: 20px; fill: currentColor; }
    .sound:hover, .sound:focus-visible { border-color: var(--accent); color: var(--text); box-shadow: 0 0 16px rgba(106, 168, 255, .45); outline: none; }
    .sound[aria-pressed="true"] { color: var(--accent); border-color: rgba(106, 168, 255, .5); }
    .sound .waves { display: none; }
    .sound[aria-pressed="true"] .waves { display: inline; }
    .sound[aria-pressed="true"] .slash { display: none; }

    /* ---- Layout: the video sits whole in the middle; two rows of links above it (3 + 2) and two below (3 + 2) ---- */
    :root { --rt: clamp(190px, 27vh, 230px); --rb: clamp(150px, 20vh, 170px); }   /* heights of the space above / below the video; the video fills what is left */
    body { overflow: hidden; }
    main { position: relative; z-index: 50; pointer-events: none; }
    .avatar { pointer-events: auto; }
    footer { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); margin: 0; z-index: 4; }
    .band {
      position: fixed; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 14px;
    }
    #top { top: 82px; }
    #bottom { bottom: 36px; }
    /* each row is a grid of equal-size buttons; the row sets their size (--n buttons, --w max width, --f font, --h height, --ic icon) */
    .row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; width: min(100%, var(--w)); }
    .r1 { --n: 3; --w: 380px; --f: 13px; --h: 46px; --ic: 20px; }
    .r2 { --n: 2; --w: 262px; --f: 12.5px; --h: 42px; --ic: 18px; }
    li.section { display: none; }
    .band a.link {
      width: 100%; height: 100%; min-height: var(--h); padding: 6px 10px; gap: 7px;
      font-size: var(--f); line-height: 1.15; text-align: left; white-space: normal;
      -webkit-tap-highlight-color: transparent;
    }
    .band a.link > svg, .band a.link > .logo { position: static; margin: 0; flex: 0 0 auto; }
    .band a.link svg, .band .logo { width: var(--ic); height: var(--ic); }
    /* the round project logos and the globe have a ring / padding inside their box, so they are drawn a little bigger to look as big as the top icons */
    .band .logo { width: calc(var(--ic) + 7px); height: calc(var(--ic) + 7px); }
    #bottom a.link > svg { width: calc(var(--ic) + 3px); height: calc(var(--ic) + 3px); }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      facebook: '<path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/>',
      shield: '<path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18 7 3.11V11c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V6.29l7-3.11z"/>',
      message: '<path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM8 11a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 8 11zm4 0a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 12 11zm4 0a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 16 11z"/>',
      web: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8.1 8zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4z"/>'
    };

    // Icons that are not drawn on the 24x24 grid
    const VIEWBOX = { gmail: "52 42 88 66" };

    const list = document.getElementById("links");
    LINKS.forEach((l, i) => {
      if (l.section) {
        const label = document.createElement("li");
        label.className = "section";
        label.style.setProperty("--i", i);
        label.textContent = l.section;
        list.append(label);
      }
      const li = document.createElement("li");
      li.style.setProperty("--i", i);
      const a = document.createElement("a");
      a.className = "link";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      const brand = l.brand || l.color;
      if (brand) {
        a.style.setProperty("--brand", brand);
        a.style.setProperty("--glow", brand + "73");
      }
      if (l.logo) {
        a.classList.add("project");
        a.style.setProperty("--ring", l.ring || l.brand);
        a.innerHTML = `<span class="logo"><img src="${l.logo}" alt="" width="17" height="17" loading="lazy"></span>`;
      } else {
        a.innerHTML = `<svg viewBox="${VIEWBOX[l.icon] || "0 0 24 24"}" aria-hidden="true" style="color:${l.color || "currentColor"}">${ICONS[l.icon] || ICONS.web}</svg>`;
      }
      a.append(l.title);
      li.append(a);
      list.append(li);
    });
    // Pin every icon in one straight column, 12px to the left of the widest label (labels stay centred)
    function placeIcons() {
      let widest = 0;
      list.querySelectorAll("a.link").forEach(a => {
        const range = document.createRange();
        range.selectNodeContents(a.lastChild);
        widest = Math.max(widest, range.getBoundingClientRect().width);
      });
      list.style.setProperty("--icon-left", `max(20px, calc(50% - ${widest / 2 + 12 + 20}px))`);
    }
    placeIcons();
    document.fonts.ready.then(placeIcons); // re-measure once Poppins has loaded
    document.getElementById("year").textContent = new Date().getFullYear();

    // The background video carries the song: the button just mutes/unmutes it, so picture and sound stay in sync.
    // Browsers only allow sound after a tap, so it starts muted if it has to and the first tap anywhere turns it on.
    (() => {
      const btn = document.getElementById("sound"), video = document.getElementById("bgvideo");
      function setSound(on) {
        video.muted = !on;
        btn.setAttribute("aria-pressed", on);
        btn.setAttribute("aria-label", on ? "Turn sound off" : "Turn sound on");
      }
      btn.addEventListener("click", () => { setSound(video.muted); if (video.paused) video.play().catch(() => {}); });
      video.muted = false;
      video.play().then(() => setSound(true)).catch(() => {
        video.muted = true; video.play().catch(() => {});
        const first = e => { if (btn.contains(e.target)) return; setSound(true); if (video.paused) video.play().catch(() => {}); };
        addEventListener("pointerup", first, { once: true });
        addEventListener("keydown", first, { once: true });
      });
    })();

    // Dark-navy lightning on the black background. It is drawn behind the video (which is opaque), so the bolts
    // flash around it and never across it. Skipped when reduced motion is requested.
    (() => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = document.getElementById("bolts"), ctx = canvas.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rand = (a, b) => a + Math.random() * (b - a);
      let w, h, scale, bolts = [], started = false, nextStrike = 0, nextArc = 0;

      function resize() {
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        scale = Math.min(1.3, Math.max(.7, w / 700));
      }

      function jagged(x0, y0, x1, y1, disp, depth) {
        let pts = [[x0, y0], [x1, y1]];
        for (let d = 0; d < depth; d++) {
          const out = [pts[0]];
          for (let i = 0; i < pts.length - 1; i++) {
            const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
            const len = Math.hypot(bx - ax, by - ay) || 1, o = (Math.random() - .5) * disp;
            out.push([(ax + bx) / 2 - (by - ay) / len * o, (ay + by) / 2 + (bx - ax) / len * o], [bx, by]);
          }
          pts = out; disp *= .55;
        }
        return pts;
      }

      function branches(main, mainLen, paths, chance, wid) {
        for (let i = 3; i < main.length - 2; i += 2) {
          if (Math.random() > chance) continue;
          const [x, y] = main[i], [px, py] = main[i - 2];
          const base = Math.atan2(y - py, x - px) + (Math.random() < .5 ? -1 : 1) * rand(.35, 1.0);
          const len = mainLen * rand(.06, .2);
          const pts = jagged(x, y, x + Math.cos(base) * len, y + Math.sin(base) * len, len * .45, 4);
          paths.push({ pts, w: wid });
          if (Math.random() < .3) {
            const [mx, my] = pts[pts.length >> 1], a = base + rand(-.9, .9), l = len * rand(.3, .6);
            paths.push({ pts: jagged(mx, my, mx + Math.cos(a) * l, my + Math.sin(a) * l, l * .5, 3), w: wid * .6 });
          }
        }
      }

      // a bolt that starts on a random screen edge or corner and reaches in towards the middle
      function strike(now) {
        const side = Math.floor(rand(0, 4));    // 0 top, 1 bottom, 2 left, 3 right
        const x0 = side < 2 ? rand(0, w) : side === 2 ? rand(-10, .08 * w) : rand(.92 * w, w + 10);
        const y0 = side === 0 ? -10 : side === 1 ? h + 10 : rand(0, h);
        const k = rand(.3, .6);
        const x1 = x0 + (w / 2 - x0) * k + rand(-.12 * w, .12 * w), y1 = y0 + (h / 2 - y0) * k + rand(-.1 * h, .1 * h);
        const len = Math.hypot(x1 - x0, y1 - y0), main = jagged(x0, y0, x1, y1, len * .3, 6);
        const paths = [{ pts: main, w: 1 }];
        branches(main, len, paths, .4, .5);
        bolts.push({ born: now, life: 620, decay: 55, strikes: [0, rand(60, 120), rand(170, 270)], scale, paths });
      }

      // a horizontal arc crawling across
      function arc(now) {
        const x0 = rand(-.05 * w, .9 * w), y0 = rand(.03 * h, .6 * h), dir = Math.random() < .5 ? -1 : 1;
        const len = rand(.15, .5) * w, x1 = x0 + dir * len, y1 = y0 + rand(-.07, .07) * h;
        const main = jagged(x0, y0, x1, y1, len * .22, 6);
        const paths = [{ pts: main, w: .55 }];
        branches(main, len, paths, .5, .3);
        bolts.push({ born: now, life: 330, decay: 42, strikes: [0, rand(50, 100)], scale, paths });
      }

      function pulse(b, age) {  // return strokes: a bright hit, then quick flickers
        let v = 0;
        for (const s of b.strikes) if (age >= s) v += Math.exp(-(age - s) / b.decay);
        return Math.min(1, v);
      }

      function draw(now) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (const b of bolts) {
          const k = pulse(b, now - b.born);
          if (k < .01) continue;
          for (const p of b.paths) {
            ctx.beginPath();
            p.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
            const s = p.w * b.scale;
            ctx.strokeStyle = `rgba(20,40,125,${.55 * k})`;    ctx.lineWidth = 16 * s;  ctx.stroke();   // dark navy glow
            ctx.strokeStyle = `rgba(35,65,170,${.8 * k})`;     ctx.lineWidth = 5.5 * s; ctx.stroke();
            ctx.strokeStyle = `rgba(95,135,235,${k})`;         ctx.lineWidth = 2 * s;   ctx.stroke();   // core stays navy, not white
          }
        }
      }

      function frame(now) {
        if (!started) { started = true; nextStrike = now + 900; nextArc = now + 250; }
        if (now > nextArc) { arc(now); nextArc = now + rand(150, 500); }
        if (now > nextStrike) {
          strike(now);
          nextStrike = now + (Math.random() < .4 ? rand(150, 350) : rand(700, 1800));   // sometimes a double strike
        }
        bolts = bolts.filter(b => now - b.born < b.life);
        draw(now);
        requestAnimationFrame(frame);
      }

      addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    })();

    // Put the links in their rows: 3 + 2 above the video, 3 + 2 below it
    (() => {
      const lis = [...list.querySelectorAll("li:not(.section)")];
      const by = title => lis.find(li => li.firstElementChild.textContent.trim() === title);
      const band = (id, rows) => {
        const ul = document.createElement("div");
        ul.id = id; ul.className = "band";
        for (const [cls, titles] of rows) {
          const row = document.createElement("ul");
          row.className = "row " + cls;
          row.append(...titles.map(by).filter(Boolean));
          ul.append(row);
        }
        document.body.append(ul);
      };
      band("top", [["r1", ["LinkedIn", "Facebook", "VSCO"]], ["r2", ["Gmail", "GitHub"]]]);
      band("bottom", [["r1", ["Nashmi", "SafeShare", "pixels"]], ["r2", ["Portfolio", "FC"]]]);
      list.remove();
    })();
  </script>
